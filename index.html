<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mpesa Fee Calculator & Currency Converter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="calculator">
      <h1>Mpesa Fee Calculator</h1>

      <label for="transactionType">Transaction Type:</label>
      <select id="transactionType">
        <option value="send">Send Money</option>
        <option value="paybill">Paybill</option>
        <option value="buygoods">Buy Goods & Services</option>
        <option value="withdraw">Withdraw Cash</option>
      </select>

      <label for="amount">Amount (Ksh):</label>
      <input type="number" id="amount" placeholder="Enter amount" />

      <div id="result" class="results-container"></div>
    </div>

    <hr />

    <div class="converter">
      <h1>Currency Converter 🌍</h1>

      <label for="fromCurrency">From:</label>
      <select id="fromCurrency"></select>

      <label for="toCurrency">To:</label>
      <select id="toCurrency"></select>

      <label for="convertAmount">Amount:</label>
      <input type="number" id="convertAmount" placeholder="Enter amount" />

      <button id="convertBtn">Convert</button>

      <div id="convertResult" class="results-container"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
